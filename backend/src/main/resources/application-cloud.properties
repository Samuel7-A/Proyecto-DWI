# Perfil exclusivo del despliegue. Activar junto con supabase.
# No hay valores por defecto que puedan seleccionar H2 o una BD de pruebas.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.h2.console.enabled=false
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'America/Lima'
# Render proporciona PORT. No permitir orígenes de desarrollo por defecto.
server.address=0.0.0.0
server.port=${PORT:8080}
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
cineverse.cors.allowed-origins=${CINEVERSE_ALLOWED_ORIGINS:}
