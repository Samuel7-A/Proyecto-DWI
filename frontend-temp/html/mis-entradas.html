        </a>
        <button class="navbar-toggler border-0 text-light" type="button" data-bs-toggle="collapse"
          data-bs-target="#cvNavContent" aria-controls="cvNavContent" aria-expanded="false" aria-label="Abrir menú">
          <i class="bi bi-list fs-2"></i>
        </button>
        <div class="collapse navbar-collapse justify-content-between" id="cvNavContent">
          <ul class="navbar-nav mx-auto my-3 my-lg-0">
            <li class="nav-item"><a class="nav-link cv-nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link cv-nav-link" href="cartelera.html">Cartelera</a></li>
            <li class="nav-item"><a class="nav-link cv-nav-link" href="proximamente.html">Próximamente</a></li>
          </ul>
          <div class="d-flex align-items-center gap-2">
            <a href="cartelera.html" class="cv-nav-icon-btn" aria-label="Buscar películas">
              <i class="bi bi-search"></i>
            </a>
            <a href="mis-entradas.html" class="cv-nav-icon-btn" aria-label="Mis entradas">
              <i class="bi bi-ticket-perforated"></i>
            </a>
            <div id="cv-cuenta" class="cv-cuenta"></div>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="cv-section">
      <div class="container">
        <span class="eyebrow">MI CUENTA</span>
        <h1 class="cv-section-title mt-2 mb-2">Mis entradas</h1>
        <p class="text-muted-cv mb-4">Estas son las órdenes de compra registradas con tu cuenta.</p>
        <div id="cv-ordenes">
          <div class="cv-skeleton" style="height: 180px;"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="cv-footer">
    <div class="container">
      <div class="row align-items-center gy-4">
        <div class="col-12 col-md-4">
          <a href="index.html" class="d-flex align-items-center gap-2">
            <span class="cv-brand-mark"><i class="bi bi-camera-reels-fill"></i></span>
            <span class="cv-brand-text">
              <span class="d-block cv-brand-name">CineVerse</span>
              <span class="d-block cv-brand-tagline">MÁS QUE PELÍCULAS</span>
            </span>
          </a>
        </div>
        <div class="col-12 col-md-4 text-center">
          <span class="cv-footer-tagline">EL CINE SIEMPRE ES UNA BUENA IDEA</span>
        </div>
        <div class="col-12 col-md-4">
          <div class="d-flex justify-content-center justify-content-md-end align-items-center gap-3 mb-3">
            <a href="#" class="cv-social-icon" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
            <a href="#" class="cv-social-icon" aria-label="TikTok"><i class="bi bi-tiktok"></i></a>
            <a href="#" class="cv-social-icon" aria-label="YouTube"><i class="bi bi-youtube"></i></a>
            <a href="#" class="cv-social-icon" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
          </div>
          <div class="text-center text-md-end">
            <a href="admin.html" class="text-decoration-underline text-muted-cv small cv-solo-admin" hidden>Administración</a>
            <div><small>CineVerse © 2026 &nbsp;·&nbsp; Todos los derechos reservados.</small></div>
          </div>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    function esc(v) {
      return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function fmtFecha(v) {
      if (!v) return "—";
      let d;
      if (Array.isArray(v)) {
        const [y, m, dd, h = 0, mi = 0] = v;
        d = new Date(y, m - 1, dd, h, mi);
      } else {
        d = new Date(v);
      }
      if (isNaN(d.getTime())) return String(v);
      return d.toLocaleDateString("es-PE", { day: "2-digit", month: "2-digit", year: "numeric" }) +
        " · " + d.toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" });
    }

    function fmtTotal(total) {
      const n = Number(total);
      return isNaN(n) ? "—" : "S/ " + n.toFixed(2);
    }

    document.addEventListener("DOMContentLoaded", async function () {
      if (!cvAuthRequiereSesion()) return;

      const sesion = cvAuthLeer();
      const cont = document.getElementById("cv-ordenes");

      try {
        const res = await fetch("http://localhost:8080/api/ordenes", {
          headers: { Authorization: "Bearer " + sesion.token }
        });

        if (!res.ok) {
          throw new Error("No se pudieron cargar tus órdenes (HTTP " + res.status + ").");
        }

        const ordenes = await res.json();

        if (!ordenes || ordenes.length === 0) {
          cont.innerHTML =
            '<div class="cv-empty-state">' +
              '<i class="bi bi-ticket-perforated mb-2 d-block" style="font-size:1.8rem;"></i>' +
              "Aún no tienes compras registradas." +
              '<div class="mt-3"><a href="cartelera.html" class="btn-cv-primary">Ver cartelera</a></div>' +
            "</div>";
          return;
        }

        cont.innerHTML =
          '<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3 g-lg-4">' +
            ordenes.map(function (o) {
              return (
                '<div class="col">' +
                  '<article class="cv-order-card">' +
                    '<span class="cv-order-badge"><i class="bi bi-check-circle"></i>' + esc(o.estado || "PAGADA") + "</span>" +
                    '<div class="cv-order-code">Orden #' + esc(o.id) + "</div>" +
                    '<div class="cv-order-total">' + esc(fmtTotal(o.total)) + "</div>" +
                    '<div class="cv-order-meta"><i class="bi bi-calendar-event me-2"></i>' + esc(fmtFecha(o.fechaCreacion)) + "</div>" +
                  "</article>" +
                "</div>"
              );
            }).join("") +
          "</div>" +
          '<p class="text-muted-cv small mt-4 mb-0">' +
            "El backend actual expone el resumen de cada orden (número, estado, total y fecha). " +
            "El detalle por asiento de cada entrada no está disponible a través de un endpoint público." +
          "</p>";
      } catch (err) {
        cont.innerHTML =
          '<div class="cv-empty-state">' +
            '<i class="bi bi-wifi-off mb-2 d-block" style="font-size:1.8rem;"></i>' +
            esc(err.message) +
            '<div class="mt-3"><button type="button" class="btn-cv-outline" id="btn-reintentar">Reintentar</button></div>' +
          "</div>";
        document.getElementById("btn-reintentar").addEventListener("click", function () {
          window.location.reload();
        });
      }
    });
  </script>
</body>
</html>
