<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi perfil · CineVerse</title>
  <meta name="description" content="Consulta los datos de tu cuenta en CineVerse." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="../css/public.css" />
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg cv-navbar py-3">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
          <span class="cv-brand-mark"><i class="bi bi-camera-reels-fill"></i></span>
          <span class="cv-brand-text">
            <span class="d-block cv-brand-name">CineVerse</span>
            <span class="d-block cv-brand-tagline">MÁS QUE PELÍCULAS</span>
          </span>
        </a>
        <button class="navbar-toggler border-0 text-light" type="button" data-bs-toggle="collapse"
          data-bs-target="#cvNavContent" aria-controls="cvNavContent" aria-expanded="false" aria-label="Abrir menú">
          <i class="bi bi-list fs-2"></i>
        </button>
        <div class="collapse navbar-collapse justify-content-between" id="cvNavContent">
          <ul class="navbar-nav mx-auto my-3 my-lg-0">
            <li class="nav-item"><a class="nav-link cv-nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link cv-nav-link" href="cartelera.html">Cartelera</a></li>
            <li class="nav-item"><a class="nav-link cv-nav-link" href="proximamente.html">Próximamente</a></li>
          </ul>
          <div class="d-flex align-items-center gap-2">
            <a href="cartelera.html" class="cv-nav-icon-btn" aria-label="Buscar películas">
              <i class="bi bi-search"></i>
            </a>
            <a href="mis-entradas.html" class="cv-nav-icon-btn" aria-label="Mis entradas">
              <i class="bi bi-ticket-perforated"></i>
            </a>
            <div id="cv-cuenta" class="cv-cuenta"></div>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="cv-section">
      <div class="container">
        <span class="eyebrow">MI CUENTA</span>
        <h1 class="cv-section-title mt-2 mb-4">Mi perfil</h1>
        <div id="cv-perfil">
          <div class="cv-skeleton" style="height: 240px; max-width: 720px;"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="cv-footer">
    <div class="container">
      <div class="row align-items-center gy-4">
        <div class="col-12 col-md-4">
          <a href="index.html" class="d-flex align-items-center gap-2">
            <span class="cv-brand-mark"><i class="bi bi-camera-reels-fill"></i></span>
            <span class="cv-brand-text">
              <span class="d-block cv-brand-name">CineVerse</span>
              <span class="d-block cv-brand-tagline">MÁS QUE PELÍCULAS</span>
            </span>
          </a>
        </div>
        <div class="col-12 col-md-4 text-center">
          <span class="cv-footer-tagline">EL CINE SIEMPRE ES UNA BUENA IDEA</span>
        </div>
        <div class="col-12 col-md-4">
          <div class="d-flex justify-content-center justify-content-md-end align-items-center gap-3 mb-3">
            <a href="#" class="cv-social-icon" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
            <a href="#" class="cv-social-icon" aria-label="TikTok"><i class="bi bi-tiktok"></i></a>
            <a href="#" class="cv-social-icon" aria-label="YouTube"><i class="bi bi-youtube"></i></a>
            <a href="#" class="cv-social-icon" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
          </div>
          <div class="text-center text-md-end">
            <a href="admin.html" class="text-decoration-underline text-muted-cv small cv-solo-admin" hidden>Administración</a>
            <div><small>CineVerse © 2026 &nbsp;·&nbsp; Todos los derechos reservados.</small></div>
          </div>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    function esc(v) {
      return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    document.addEventListener("DOMContentLoaded", function () {
      if (!cvAuthRequiereSesion()) return;

      const sesion = cvAuthLeer();
      const cont = document.getElementById("cv-perfil");
      const inicial = (sesion.nombre || sesion.email || "?").trim().charAt(0).toUpperCase();
      const rolLabel = sesion.rol === "ADMIN" ? "Administrador" : "Cliente";

      cont.innerHTML =
        '<div class="cv-profile-card">' +
          '<div class="d-flex align-items-center gap-3 mb-4 flex-wrap">' +
            '<span class="cv-profile-avatar">' + esc(inicial) + "</span>" +
            "<div>" +
              '<h2 class="cv-section-title mb-2" style="font-size:1.4rem;">' +
                esc(sesion.nombre || "Usuario") + "</h2>" +
              '<span class="cv-chip"><i class="bi bi-person-badge"></i>' + esc(rolLabel) + "</span>" +
            "</div>" +
          "</div>" +
          '<div class="cv-profile-row">' +
            '<span class="cv-profile-key">Nombre</span>' +
            '<span class="cv-profile-val">' + esc(sesion.nombre || "—") + "</span>" +
          "</div>" +
          '<div class="cv-profile-row">' +
            '<span class="cv-profile-key">Correo electrónico</span>' +
            '<span class="cv-profile-val">' + esc(sesion.email || "—") + "</span>" +
          "</div>" +
          '<div class="cv-profile-row">' +
            '<span class="cv-profile-key">Rol</span>' +
            '<span class="cv-profile-val">' + esc(rolLabel) + "</span>" +
          "</div>" +
          '<p class="text-muted-cv small mt-4 mb-0">' +
            "La edición de datos personales no está disponible en esta versión: " +
            "el backend actual no expone un servicio para actualizar el perfil." +
          "</p>" +
        "</div>";
    });
  </script>
</body>
</html>
