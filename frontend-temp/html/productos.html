<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos | CineVerse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/public.css" rel="stylesheet">
  <link href="../css/productos.css" rel="stylesheet">
  <script src="../js/productos.js" defer></script>

<body>
<header><nav class="navbar navbar-expand-lg cv-navbar py-3"><div class="container">
  <a class="navbar-brand cv-brand-name" href="index.html">🎬 CineVerse</a>
  <div class="d-flex gap-3"><a class="cv-nav-link" href="index.html">Inicio</a><a class="cv-nav-link" href="cartelera.html">Cartelera</a><a class="cv-nav-link active" href="productos.html">Productos</a></div>

<main class="container py-5">
