<div class="cv-cuenta">
  @if (!auth.isLoggedIn()) {
    <a routerLink="/login" class="cv-cuenta-login">
      <i class="bi bi-person-circle"></i> Iniciar sesión
    </a>
  } @else {
    <div class="dropdown cv-cuenta">
      <button
        class="cv-cuenta-toggle dropdown-toggle"
        type="button"
        (click)="alternar()"
        [attr.aria-expanded]="abierto">
        <span class="cv-cuenta-avatar">{{ inicial() }}</span>
        <span class="cv-cuenta-nombre">{{ nombreMostrado() }}</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end cv-cuenta-menu" [class.show]="abierto">
        <li class="cv-cuenta-email">{{ auth.email() }}</li>
        <li><hr class="dropdown-divider" /></li>
        <li>
          <a class="dropdown-item" routerLink="/perfil" (click)="abierto = false">
            <i class="bi bi-person me-2"></i>Mi perfil
          </a>
        </li>
        @if (!auth.isAdmin()) {
          <li>
            <a class="dropdown-item" routerLink="/mis-entradas" (click)="abierto = false">
              <i class="bi bi-ticket-perforated me-2"></i>Mis entradas
            </a>
          </li>
        }
        @if (auth.isAdmin()) {
          <li>
            <a class="dropdown-item" routerLink="/admin" (click)="abierto = false">
              <i class="bi bi-shield-lock me-2"></i>Panel de administración
            </a>
          </li>
        }
        <li><hr class="dropdown-divider" /></li>
        <li>
          <button type="button" class="dropdown-item cv-cuenta-logout" (click)="cerrarSesion()">
            <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
          </button>
        </li>
      </ul>
    </div>
  }
</div>
