<header>
  <nav class="navbar navbar-expand-lg cv-navbar py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
        <span class="cv-brand-mark"><i class="bi bi-camera-reels-fill"></i></span>
        <span class="cv-brand-text">
          <span class="d-block cv-brand-name">CineVerse</span>
          <span class="d-block cv-brand-tagline">MÁS QUE PELÍCULAS</span>
        </span>
      </a>

      <button
        class="navbar-toggler border-0 text-light"
        type="button"
        (click)="alternarNav()"
        aria-label="Abrir menú">
        <i class="bi bi-list fs-2"></i>
      </button>

      <div
        class="collapse navbar-collapse justify-content-between"
        [class.show]="navAbierto">
        <ul class="navbar-nav mx-auto my-3 my-lg-0">
          <li class="nav-item">
            <a class="nav-link cv-nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link cv-nav-link" routerLink="/cartelera" routerLinkActive="active">Cartelera</a>
          </li>
          <li class="nav-item">
            <a class="nav-link cv-nav-link" routerLink="/proximamente" routerLinkActive="active">Próximamente</a>
          </li>
          <li class="nav-item">
            <a class="nav-link cv-nav-link" routerLink="/productos" routerLinkActive="active">Dulcería</a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-2">
          <a routerLink="/cartelera" class="cv-nav-icon-btn" aria-label="Buscar películas">
            <i class="bi bi-search"></i>
          </a>
          <a routerLink="/mis-entradas" class="cv-nav-icon-btn" aria-label="Mis entradas">
            <i class="bi bi-ticket-perforated"></i>
          </a>
          <app-cuenta />
        </div>
      </div>
    </div>
  </nav>
</header>
